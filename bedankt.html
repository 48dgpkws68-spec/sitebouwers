<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gelukt · Sitebouwers</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232A3BE8'/%3E%3Ctext x='30' y='46' font-family='Arial Black,Arial,sans-serif' font-size='38' font-weight='900' fill='%23F5F2EB' text-anchor='middle'%3Es%3C/text%3E%3Ccircle cx='49' cy='43' r='5.5' fill='%23FF5A26'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;700;900&family=Fraunces:ital,opsz,wght@1,9..144,420&family=Space+Mono&display=swap" rel="stylesheet">
<style>
:root{--paper:#F5F2EB;--ink:#111116;--cobalt:#2A3BE8;--orange:#FF5A26;--line:rgba(17,17,22,.16)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Archivo",system-ui,sans-serif;background:var(--paper);color:var(--ink);min-height:100svh;display:flex;align-items:center;justify-content:center;padding:24px;
background-image:linear-gradient(rgba(17,17,22,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(17,17,22,.07) 1px,transparent 1px);background-size:56px 56px}
.box{max-width:620px;text-align:center}
.mono{font-family:"Space Mono",monospace;font-size:.72rem;letter-spacing:.15em;text-transform:uppercase;color:var(--cobalt)}
h1{font-size:clamp(2.6rem,8vw,4.6rem);font-weight:900;letter-spacing:-.03em;margin:18px 0 16px}
h1 em{font-family:"Fraunces",serif;font-style:italic;font-weight:420;color:var(--cobalt)}
p{color:rgba(17,17,22,.64);font-size:1.08rem;line-height:1.6;margin-bottom:34px}
.btn{display:inline-flex;align-items:center;gap:10px;background:var(--ink);color:var(--paper);border-radius:999px;padding:16px 30px;font-weight:700;text-decoration:none;border:1.5px solid var(--ink);transition:background .25s,border-color .25s}
.btn:hover{background:var(--cobalt);border-color:var(--cobalt)}
.sub{margin-top:40px;padding-top:26px;border-top:1.5px solid var(--line);font-size:.92rem;color:rgba(17,17,22,.55)}
.sub a{color:var(--ink);font-weight:700;text-decoration:none;border-bottom:2px solid var(--orange)}
</style>
</head>
<body>
<div class="box">
  <span class="mono">Aanvraag ontvangen</span>
  <h1>Gelukt. <em>We gaan bouwen.</em></h1>
  <p>Je aanvraag is binnen. Je hoort binnen 24 uur van ons, meestal een stuk sneller. Check voor de zekerheid ook even je spamfolder.</p>
  <a class="btn" href="/">Terug naar de site</a>
  <p class="sub">Alvast inspiratie opdoen? Bekijk <a href="https://plutusestate.com" target="_blank" rel="noopener">plutusestate.com</a> of <a href="https://4neon.com" target="_blank" rel="noopener">4neon.com</a>, allebei door ons gebouwd.</p>
</div>
</body>
</html>
